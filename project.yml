name: OpenScroll
options:
  bundleIdPrefix: com.openscroll
  createIntermediateGroups: true

targets:
  OpenScroll:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: OpenScroll
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openscroll.app
        PRODUCT_NAME: OpenScroll
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        INFOPLIST_KEY_CFBundleDisplayName: OpenScroll
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
